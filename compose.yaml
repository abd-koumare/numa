name: numa

x-backend: &backend
  build:
    context: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-environment
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:-numa}
    POSTGRES_USER: ${POSTGRES_USER:-numa}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-numa_dev_password}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key-change-me}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    OIDC_ISSUER: http://localhost:8080/realms/numa
    OIDC_JWKS_URL: http://keycloak:8080/realms/numa/protocol/openid-connect/certs
    OIDC_AUDIENCE: numa-api
    AWS_S3_ENDPOINT_URL: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-numa}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-numa_dev_password}
    MINIO_BUCKET: ${MINIO_BUCKET:-numa-documents}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    CLAMAV_HOST: clamav
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-numa}
      POSTGRES_USER: ${POSTGRES_USER:-numa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-numa_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-keycloak-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numa} -d ${POSTGRES_DB:-numa}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-numa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-numa_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-numa} ${MINIO_ROOT_PASSWORD:-numa_dev_password};
        mc mb --ignore-existing local/${MINIO_BUCKET:-numa-documents};
        mc anonymous set none local/${MINIO_BUCKET:-numa-documents}
    restart: "no"

  clamav:
    image: clamav/clamav:1.4.3
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-numa}
      KC_DB_USERNAME: ${POSTGRES_USER:-numa}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-numa_dev_password}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/numa-realm.json:/opt/keycloak/data/import/numa-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"HEAD /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"HTTP/1.0 200\\|HTTP/1.1 200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    <<: *backend
    command: ["sh", "/app/entrypoint.sh"]
    environment:
      <<: *backend-environment
      NUMA_COLLECTSTATIC: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    <<: *backend
    command: ["celery", "-A", "numa", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      api:
        condition: service_healthy
      clamav:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      VITE_DATA_MODE: ${VITE_DATA_MODE:-api}
      VITE_AUTH_MODE: ${VITE_AUTH_MODE:-oidc}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:8080/realms/numa}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-numa-web}
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles: ["test"]
    network_mode: host
    user: "1000:1000"
    working_dir: /workspace
    environment:
      HOME: /tmp
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - .:/workspace
    entrypoint: ["npx", "playwright", "test"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
  frontend_node_modules:
